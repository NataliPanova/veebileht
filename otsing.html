<!DOCTYPE html>
<html lang="en">


<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Krõbedad tudengid</title>
        <link rel="stylesheet" href="main.css">
        <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
        <script src="script.js" defer></script>
        <script src="https://kit.fontawesome.com/2cb1c8ae17.js" crossorigin="anonymous"></script>
</head>

<body>

<div class="topnav">

    <div class="nimi">
        <p>Krõbedad tudengid</p>
    </div>

    <div class="menu">
        <a href="index.html" >Pealeht</a>
        <a href="otsing.html" class="active">Otsing</a>
        <a href="meist.html">Meist</a>
    </div>

</div>

<div class="search-page">
    <h1>Otsing</h1>

    <div class="search-layout">
        <aside class="search-sidebar">

            <label for="search-input">Otsi</label>

            <input
                id="search-input"
                type="search"
                placeholder="Sisesta otsingusõna..."
                oninput="filterResults()"
            >

            
            <div id="search-filters" class="search-filters">
            </div>

        </aside>

        <div class="search-results" id="search-results" aria-label="Otsingutulemused">
        </div>
    </div>
</div>

<dialog id="recipeModal">
    <!-- sulgemisnupp paremas ülanurgas -->
    <form method="dialog">
        <button class="close-btn" aria-label="Sulge">&times;</button>
    </form>

    <!-- ülemine osa: pilt vasakul ja retsepti info paremal -->
    <div class="modal-top">
        <img id="modalImage" src="" alt="Retsepti pilt" class="modal-img">

        <div class="modal-header-info">
            <!-- filtrite rida (nt soolane, soe) -->
            <div id="modalFilters" class="modal-tags"></div>

            <!-- retsepti pealkiri ja kirjeldus -->
            <h2 id="modalTitle"></h2>
            <p id="modalDesc" class="modal-desc-text"></p>

            <!-- 3 väikest kasti: Hind / Raskustase / Aeg -->
            <div class="modal-info-row">
                <div class="info-pill">
                    <i class="fa-solid fa-euro-sign"></i>
                    <span>Hind: <strong id="modalPrice">-</strong></span>
                </div>
                <div class="info-pill">
                    <i class="fa-solid fa-signal"></i>
                    <span id="modalDifficulty">-</span>
                </div>
                <div class="info-pill">
                    <i class="fa-regular fa-clock"></i>
                    <span>Aeg: <strong id="modalTime">-</strong></span>
                </div>
            </div>
        </div>
    </div>

    <hr class="modal-divider">

    <!-- alumine osa: koostisosad vasakul ja step by step paremal -->
    <div class="modal-bottom">
        <!-- Koostisosade kast -->
        <div class="ingredients-card">
            <h3>Koostisosad</h3>
            <ul id="modalIngredients" class="ingredients-list"></ul>
        </div>

        <!-- step by step juhendi osa -->
        <div class="steps-section">
            <h3>Valmistamine</h3>
            <ol id="modalSteps" class="steps-list"></ol>
        </div>
    </div>
</dialog>

</body>
