<!DOCTYPE html>
<html lang="en">


<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Krõbedad tudengid</title>
        <link rel="stylesheet" href="main.css">
        <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
        <script src="script.js" defer></script>
        <script src="https://kit.fontawesome.com/2cb1c8ae17.js" crossorigin="anonymous"></script>
</head>

<body>

<div class="topnav">
    <a href="index.html">Pealeht</a>
    <a href="otsing.html" class="active">Otsing</a>
    <a href="meist.html">Meist</a>
</div>

<div class="search-page">
    <h1>Otsing</h1>

    <div class="search-layout">
        <aside class="search-sidebar">

            <label for="search-input">Otsi</label>

            <input
                id="search-input"
                type="search"
                placeholder="Sisesta otsingusõna..."
                oninput="filterResults()"
            >

            
            <div id="search-filters" class="search-filters">
            </div>

        </aside>

        <div class="search-results" id="search-results" aria-label="Otsingutulemused">
        </div>
    </div>
</div>

<dialog id="recipeModal">
    <form method="dialog">
        <button class="close-btn" aria-label="Sulge">x</button>
    </form>

    <div id="modalContent">
        <div id="modalImageContainer">
            <img id="modalImage" src="" alt="Retsepti pilt">
        </div>

        <div style="flex: 1 1 300px; min-width: 0;">
            <h2 id="modalTitle"></h2>

            <h3>Kirjeldus</h3>
            <p id="modalDesc"></p>

            <h3>Koostisosad</h3>
            <ul id="modalIngredients"></ul>

            <h3>Valmistamine</h3>
            <ol id="modalSteps"></ol>

            <h3>Raskustase</h3>
            <p id="modalDifficulty"></p>

            <h3>Hind</h3>
            <p id="modalPrice"></p>

            <h3>Ajakulu</h3>
            <p id="modalTime"></p>
        </div>
    </div>
</dialog>

</body>
