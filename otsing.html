<div class="topnav">

<div class="search-page">
    <h1>Otsing</h1>

    <div class="search-layout">
        <aside class="search-sidebar">

            <label for="search-input">Otsi</label>

            <input
                id="search-input"
                type="search"
                placeholder="Sisesta otsingusõna..."
                oninput="filterResults()"
            >

            
            <div id="btn" class="right">
            <div class="search-filters">
                
                <button><i class="fa-solid fa-plane"></i></button>
                <button>Soolane</button>
                <button>Magus</button>
                <button>Soe</button>
                <button>Külm</button>
                <button>Hommikusöök</button>
                <button>Lõunasöök</button>
                <button>Õhtusöök</button>
                <button>Dessert</button>
            </div>

        </aside>

        <div class="search-results" id="search-results" aria-label="Otsingutulemused">
        </div>
    </div>
</div>

<dialog id="recipeModal">
    <div class="modal-hero">
        <img id="modalImage" src="" alt=""Retsepti pilt">
        <div class="modal-hero-overlay"></div>
        <form method="dialog">
            <button class="close-btn" aria-label=""Sulge">&times;</button>
        </form>
        <div class="modal-hero-content">
            <div id="modalFilters" class=""modal-tags"></div>
            <h2 id="modalTitle></h2>
    </div>

    <div class="modal-body">
        <div class="modal-meta-box">
            <div class="meta-item">
                <span class="meta-label"><i class="fa-solid fa-euro-sign"></i> HIND KOKKU</span>
                <span class="meta-value" id="modalPrice"></span>
            </div>
            <div class="meta-item">
                <span class="meta-label"><i class="fa-solid fa-signal"></i> RASKUSTASE</span>
                
            </div>
</dialog>

</body>
